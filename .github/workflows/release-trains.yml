name: Release Trains

on:
  schedule:
    # One nightly cron, in UTC. GitHub Actions cron never observes DST, so
    # this fires at 02:00 America/Halifax during ADT and 01:00 during AST.
    # A nightly internal TestFlight build does not care about that one-hour
    # seasonal drift. We deliberately do NOT add a second "companion" cron to
    # pin exact local time: the companion only ever skipped, and a skipped
    # ship job reports the whole run as success — which once hid nine straight
    # nights of real ship failures behind a daily green check.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release train to build.
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - weekly
      force:
        description: Rebuild unchanged inputs intentionally, with all existing gates
        required: false
        type: boolean
        default: false
      repair_profiles:
        description: Regenerate the Watch and widget distribution profiles once before signing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-trains
  cancel-in-progress: false
  queue: max

jobs:
  resolve:
    name: Resolve release train
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
      channel: ${{ steps.resolve.outputs.channel }}
      reason: ${{ steps.resolve.outputs.reason }}

    steps:
      - name: Resolve channel and branch
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_CHANNEL: ${{ github.event.inputs.channel || '' }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Both trigger types select a train. The separate input comparison
          # decides whether that train needs another delivery.
          channel="nightly"
          branch="nightly"
          reason="Scheduled nightly internal TestFlight train"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$REQUESTED_CHANNEL" in
              nightly)
                reason="Manual nightly internal TestFlight train"
                ;;
              weekly)
                case "$WORKFLOW_REF_NAME" in
                  main|weekly) ;;
                  *)
                    echo "::error::Weekly delivery requires the main or weekly controller."
                    exit 1
                    ;;
                esac
                channel="weekly"
                branch="weekly"
                reason="Manual weekly external TestFlight train"
                ;;
              *)
                echo "::error title=Unknown release train::Expected nightly or weekly. Got '$REQUESTED_CHANNEL'."
                exit 1
                ;;
            esac
          fi

          {
            echo "channel=$channel"
            echo "branch=$branch"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

  changes:
    name: Compare delivered build inputs
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_run: ${{ steps.changes.outputs.should_run }}
      source_sha: ${{ steps.changes.outputs.source_sha }}
      plan: ${{ steps.changes.outputs.plan }}
      ios: ${{ steps.changes.outputs.ios }}
      fingerprint_ios: ${{ steps.changes.outputs.fingerprint_ios }}
    steps:
      - name: Inspect train source tree
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.branch }}
          sparse-checkout: .github

      - name: Check out delivery guard from controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-control
          sparse-checkout: .github

      - name: Compare successful deliveries
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RELEASE: ${{ inputs.force || inputs.repair_profiles || false }}
        run: >-
          python3 .release-control/.github/scripts/release_delivery.py plan
          --controller .release-control
          --channel "${{ needs.resolve.outputs.channel }}"
          --force "$FORCE_RELEASE"

  ship:
    name: Build and ship ${{ needs.resolve.outputs.channel }}
    needs: [resolve, changes]
    if: needs.changes.outputs.should_run == 'true'
    runs-on: macos-26
    timeout-minutes: 150

    env:
      RELEASE_PLAN: ${{ needs.changes.outputs.plan }}
      RELEASE_CONTROL_SCRIPT: ${{ github.workspace }}/.release-control/.github/scripts/release_delivery.py
    steps:
      - name: Checkout train branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.source_sha }}

      - name: Check out delivery recorder from controller
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-control
          sparse-checkout: .github

      - name: Checkout release automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-automation
          sparse-checkout: |
            Gemfile
            Gemfile.lock
            fastlane/Appfile
            fastlane/Fastfile
            fastlane/Gymfile
            fastlane/lib
          sparse-checkout-cone-mode: false

      - name: Use release automation from workflow commit
        run: |
          set -euo pipefail
          cp .release-automation/Gemfile Gemfile
          cp .release-automation/Gemfile.lock Gemfile.lock
          cp .release-automation/fastlane/Appfile fastlane/Appfile
          cp .release-automation/fastlane/Fastfile fastlane/Fastfile
          cp .release-automation/fastlane/Gymfile fastlane/Gymfile
          mkdir -p fastlane/lib
          cp -R .release-automation/fastlane/lib/. fastlane/lib/
          rm -rf .release-automation

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^26.0.0"

      - name: Capture toolchain fingerprint
        id: toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -version | shasum | awk '{ print "xcode_hash="$1 }' >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData
            .build
            MacroMarkKit/.build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.toolchain.outputs.xcode_hash }}-spm-${{ hashFiles('**/Package.resolved', '**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.toolchain.outputs.xcode_hash }}-spm-

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project MacroMark.xcodeproj \
            -scheme "MacroMark"

      - name: Resolve iOS simulator destination
        id: ios-simulator
        run: |
          set -euo pipefail
          ruby <<'RUBY' >> "$GITHUB_OUTPUT"
          destinations = `xcodebuild -showdestinations -project MacroMark.xcodeproj -scheme "MacroMark" 2>&1`
          iphone = destinations.lines.find do |line|
            line.include?("platform:iOS Simulator") &&
              line.include?("name:iPhone") &&
              line.include?("id:") &&
              !line.include?("placeholder")
          end

          if iphone && (udid = iphone[/id:([^,}]+)/, 1]&.strip)
            puts "ios_udid=#{udid}"
            puts "ios_destination=platform=iOS Simulator,id=#{udid}"
          else
            warn "::error title=Release gate blocked::No available iPhone simulator was found; refusing to upload without app-hosted iOS/UI tests."
            exit 1
          end
          RUBY

      - name: Boot iOS simulator
        run: |
          set -euo pipefail
          xcrun simctl boot "${{ steps.ios-simulator.outputs.ios_udid }}" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "${{ steps.ios-simulator.outputs.ios_udid }}" -b

      - name: Build iOS app for testing
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project MacroMark.xcodeproj \
            -scheme "MacroMark" \
            -configuration Debug \
            -destination "${{ steps.ios-simulator.outputs.ios_destination }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Build watchOS app
        run: |
          set -euo pipefail
          xcodebuild build \
            -project MacroMark.xcodeproj \
            -scheme "MacroMark Watch App" \
            -configuration Debug \
            -destination "generic/platform=watchOS" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Run MacroMarkKit tests
        run: |
          set -euo pipefail
          swift test --package-path MacroMarkKit

      - name: Run iOS app and UI tests without rebuilding
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project MacroMark.xcodeproj \
            -scheme "MacroMark" \
            -configuration Debug \
            -destination "${{ steps.ios-simulator.outputs.ios_destination }}" \
            -derivedDataPath DerivedData \
            -parallel-testing-enabled NO \
            -only-testing:MacroMarkTests \
            -only-testing:MacroMarkUITests

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Ship release train
        id: delivery
        env:
          APP_STORE_CONNECT_API_KEY_JSON: ${{ secrets.APP_STORE_CONNECT_API_KEY_JSON }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          MATCH_GIT_SSH_KEY: ${{ secrets.MATCH_GIT_SSH_KEY }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          RELEASE_CHANNEL: ${{ needs.resolve.outputs.channel }}
          REPAIR_PROFILES: ${{ inputs.repair_profiles || false }}
          TESTFLIGHT_EXTERNAL_GROUPS: ${{ vars.TESTFLIGHT_EXTERNAL_GROUPS || 'External Testers' }}
        run: |
          set -euo pipefail

          has_api_key_json=false
          has_api_key_parts=false
          if [ -n "$APP_STORE_CONNECT_API_KEY_JSON" ]; then
            has_api_key_json=true
          fi
          if [ -n "$APP_STORE_CONNECT_API_KEY_KEY" ] && [ -n "$APP_STORE_CONNECT_API_KEY_KEY_ID" ] && [ -n "$APP_STORE_CONNECT_API_KEY_ISSUER_ID" ]; then
            has_api_key_parts=true
          fi

          if { [ "$has_api_key_json" != "true" ] && [ "$has_api_key_parts" != "true" ]; } || [ -z "$MATCH_PASSWORD" ] || [ -z "$MATCH_GIT_SSH_KEY" ] || [ -z "$MATCH_GIT_URL" ]; then
            echo "::error title=Missing release credentials::App Store Connect credentials and all Match secrets are required. No delivery occurred."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$MATCH_GIT_SSH_KEY" > ~/.ssh/match_git_ssh_key
          chmod 600 ~/.ssh/match_git_ssh_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/match_git_ssh_key

          bundle exec fastlane release_train channel:"$RELEASE_CHANNEL" repair_profiles:"$REPAIR_PROFILES"
          python3 "$RELEASE_CONTROL_SCRIPT" record --platform ios

      - name: Retain successful ${{ needs.resolve.outputs.channel }} ios delivery receipt
        if: success() && steps.delivery.outputs.ios_delivered == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-delivery-v1-${{ needs.resolve.outputs.channel }}-ios-${{ github.run_attempt }}-${{ needs.changes.outputs.fingerprint_ios }}
          path: ${{ runner.temp }}/release-receipts/ios.json
          retention-days: 90
          if-no-files-found: error
